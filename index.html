<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Star Predictions - Predict & Win</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;margin:0}
.header{background:#ffcc00;color:black;padding:15px;text-align:center;font-weight:bold;font-size:20px}
.game-card{background:#1a1a1a;margin:10px;padding:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.odd-btn{background:#ffcc00;color:black;border:none;padding:8px 12px;border-radius:5px;font-weight:bold;cursor:pointer;margin:2px}
.live{color:red;font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="header">⭐ FIVE STAR PREDICTIONS - Predict & Win Cash</div>

<div id="games">Loading live matches...</div>

<div style="padding:20px;text-align:center">
<h3>Your Selections: <span id="count">0</span></h3>
<button onclick="payWithPaystack()" style="background:#00ff88;color:black;padding:15px 30px;border:none;border-radius:30px;font-weight:bold;font-size:18px;width:100%">ENTER CONTEST - PAY WITH PAYSTACK</button>
<p style="font-size:12px;color:#888">This is a skill-based prediction contest. No gambling. 18+ only.</p>
</div>

<script>
// 1. LIVE GAMES - Free API
async function loadLiveGames(){
  // Using free ESPN API (no key needed for startup)
  try{
    let res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');
    let data = await res.json();
    let html = '';
    data.events.slice(0,10).forEach(match=>{
      let home = match.competitions[0].competitors[0].team.displayName;
      let away = match.competitions[0].competitors[1].team.displayName;
      let status = match.status.type.detail;
      html += `
      <div class="game-card">
        <div><span class="live">● LIVE</span><br><b>${home} vs ${away}</b><br><small>${status}</small></div>
        <div>
          <button class="odd-btn" onclick="addPick('${home}')">1 - 2.10</button>
          <button class="odd-btn" onclick="addPick('Draw')">X - 3.20</button>
          <button class="odd-btn" onclick="addPick('${away}')">2 - 2.85</button>
        </div>
      </div>`;
    });
    document.getElementById('games').innerHTML = html;
  }catch(e){
    document.getElementById('games').innerHTML = 'Live matches loading... please refresh. If fails, we will use manual games.';
  }
}
loadLiveGames();
setInterval(loadLiveGames, 60000); // refresh every 1 min

let picks = [];
function addPick(team){
  picks.push(team);
  document.getElementById('count').innerText = picks.length;
  alert(team + ' added! Total picks: ' + picks.length);
}

// 2. PAYSTACK INTEGRATION - Replace with your LIVE key from Paystack dashboard
function payWithPaystack(){
  if(picks.length==0){alert('Pick at least 1 game first!');return;}
  let handler = PaystackPop.setup({
    key: 'pk_live_YOUR_PAYSTACK_KEY_HERE', // <--- PUT YOUR LIVE KEY HERE
    email: 'customer@fivestarbets.com', // you will collect real email later
    amount: 50000, // ₦500 entry fee - change to any amount (in kobo)
    currency: 'NGN',
    ref: 'FIVESTAR_'+Math.floor((Math.random()*1000000000)+1),
    metadata:{custom_fields:[{display_name:"Picks",variable_name:"picks",value:picks.join(',')} ]},
    callback: function(response){
      alert('Payment success! Ref: ' + response.reference + '. Your predictions saved!');
      // Here you save to your database / Google Sheet
      picks = [];
      document.getElementById('count').innerText = 0;
    },
    onClose: function(){alert('Payment window closed');}
  });
  handler.openIframe();
}
</script>
</body>
</html>

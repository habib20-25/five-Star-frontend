<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five Star Bets | Elite Betting</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',system-ui}
body{background:#060b1a;color:#fff;overflow-x:hidden}
.header{position:sticky;top:0;z-index:99;background:rgba(8,14,31,0.9);backdrop-filter:blur(20px);border-bottom:2px solid #ffcc00;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px;letter-spacing:.3px}.logo span{color:#ffcc00;text-shadow:0 0 12px #ffcc00}
.badge{background:linear-gradient(135deg,#ffcc00,#ffb700);color:#000;padding:7px 16px;border-radius:30px;font-weight:900;font-size:13px;box-shadow:0 4px 15px rgba(255,204,0,.4)}
.authWrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 400px at 50% -10%,#1a2a5a 0%,#060b1a 60%)}
.authCard{width:100%;max-width:420px;background:linear-gradient(180deg,#121f3f,#0e1a33);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1)}
.stars{text-align:center;font-size:26px;letter-spacing:4px}
.authCard h1{text-align:center;font-weight:900;margin:10px 0 4px;font-size:28px}.authCard h1 b{color:#ffcc00}
.sub{color:#7e9bc7;font-size:13px;text-align:center;margin-bottom:18px}
.inp{width:100%;background:#080e1f;border:1px solid #24365f;color:#fff;padding:14px 16px;border-radius:14px;margin:8px 0;outline:none;transition:.2s}
.inp:focus{border-color:#ffcc00;box-shadow:0 0 0 3px rgba(255,204,0,.15)}
.btn{width:100%;background:linear-gradient(135deg,#ffcc00,#ffaa00);color:#000;padding:15px;border-radius:14px;font-weight:900;border:none;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 20px rgba(255,204,0,.35);transition:.2s}
.btn:active{transform:scale(.98)}
.hero{max-width:520px;margin:0 auto;padding:14px}
.leagueBar{display:flex;gap:8px;overflow:auto;padding:12px 14px;scrollbar-width:none;position:sticky;top:58px;background:rgba(6,11,26,.85);backdrop-filter:blur(12px);z-index:8}
.chip{white-space:nowrap;background:#121f3f;border:1px solid #22345f;color:#8aa3cc;padding:9px 16px;border-radius:30px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.chip.active{background:#ffcc00;color:#000;border-color:#ffcc00;box-shadow:0 4px 14px rgba(255,204,0,.4)}
.promo{margin:12px 14px;background:linear-gradient(135deg,#1a2f6a,#0e1f4a);border:1px solid #2a4173;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.promo b{color:#ffcc00}
.liveDot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(34,197,94,.2);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.match{background:linear-gradient(180deg,#121f3f 0%,#0f1b36 100%);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;margin:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s}
.match:hover{transform:translateY(-2px);border-color:rgba(255,204,0,.3)}
.leag{font-size:10px;color:#6b86b5;letter-spacing:1.2px;display:flex;gap:6px;align-items:center;font-weight:700}
.teams{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.tm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.badgeTeam{width:28px;height:28px;background:#0a1430;border-radius:8px;display:grid;place-items:center;font-size:14px;border:1px solid #22345f}
.vs{color:#3d5a8a;font-size:10px;background:#0a1430;padding:4px 8px;border-radius:20px;border:1px solid #1e2f5e}
.oddsGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.oddBtn{background:#080e1f;border:1px solid #22345f;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:.2s}
.oddBtn:hover{border-color:#ffcc00}.oddBtn.sel{background:#ffcc00;color:#000;font-weight:900;border-color:#ffcc00;transform:scale(1.03)}
.oddBtn small{font-size:10px;opacity:.7;display:block}.oddBtn b{font-size:14px}
.betDrawer{position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;background:linear-gradient(180deg,#101d3b,#0a1430);border-top:2px solid #ffcc00;border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);z-index:50}
.stakeRow{display:flex;gap:8px;margin:10px 0}
.stakeChip{flex:1;background:#080e1f;border:1px solid #22345f;border-radius:10px;padding:8px;text-align:center;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo">★★★★★ FIVE <span>STAR BETS</span></div><div id="balWrap" style="display:none;align-items:center;gap:10px"><div class="badge" id="bal">₦50,000</div><button onclick="logout()" style="background:none;border:1px solid #22345f;color:#6b86b5;padding:5px 10px;border-radius:20px;font-size:10px">EXIT</button></div></div>

<div id="auth" class="authWrap"><div class="authCard">
<div class="stars">⭐⭐⭐⭐⭐</div><h1>FIVE <b>STAR</b></h1><div class="sub">Elite leagues • Instant payout • Demo ₦50k</div>
<input id="user" class="inp" placeholder="Username e.g. Habib20"><input id="pass" class="inp" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">ENTER ARENA →</button>
<p id="msg" style="color:#ff6b6b;font-size:11px;margin-top:10px;text-align:center"></p>
<div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;font-size:10px;color:#5a7196"><span>🏆 17 Leagues</span><span>⚡ Instant</span><span>🔒 Secure</span></div>
</div></div>

<div id="app" style="display:none">
<div class="promo"><div><div style="font-size:11px;color:#7ea0d0">WELCOME BONUS</div><b style="font-size:15px">₦50,000 FREE BET</b></div><div style="background:#ffcc00;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px">DEMO</div></div>
<div class="leagueBar" id="filters"></div>
<div id="matches" style="max-width:540px;margin:0 auto;padding-bottom:260px"></div>
<div class="betDrawer" id="slip" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><div><div id="sTeams" style="font-weight:800;font-size:14px"></div><div style="font-size:11px;color:#7ea0d0"><span class="liveDot"></span> LIVE • <span id="sLeague">Premier League</span></div></div><b id="sOdd" style="background:#ffcc00;color:#000;padding:6px 12px;border-radius:20px"></b></div>
<div class="stakeRow"><div class="stakeChip" onclick="setStake(500)">₦500</div><div class="stakeChip" onclick="setStake(1000)">₦1k</div><div class="stakeChip" onclick="setStake(5000)">₦5k</div><div class="stakeChip" onclick="setStake(10000)">₦10k</div></div>
<input id="stake" type="number" class="inp" value="1000" oninput="upd()" style="margin:0">
<div style="display:flex;justify-content:space-between;margin:10px 2px;font-size:12px"><span style="color:#7ea0d0">Potential Win</span><b id="toWin" style="color:#ffcc00;font-size:16px"></b></div>
<button class="btn" onclick="place()">PLACE BET ★</button>
<div id="bets" style="margin-top:12px;max-height:110px;overflow:auto"></div>
</div>
</div>

<script>
let leagues=["ALL","Premier League","LaLiga","Serie A","Bundesliga","Ligue 1","NPFL","UCL","AFCON"];
let fixtures=[
{L:"Premier League",H:"Man City",A:"Arsenal",o:[2.10,3.20,3.30],e:"🔵"},{L:"Premier League",H:"Man Utd",A:"Chelsea",o:[2.60,3.10,2.70],e:"🔴"},{L:"Premier League",H:"Liverpool",A:"Tottenham",o:[1.85,3.60,4.10],e:"🔴"},{L:"Premier League",H:"Newcastle",A:"Brighton",o:[2.20,3.30,3.10],e:"⚫"},
{L:"LaLiga",H:"Real Madrid",A:"Barcelona",o:[2.00,3.50,3.60],e:"⚪"},{L:"LaLiga",H:"Atletico",A:"Sevilla",o:[1.90,3.20,4.20],e:"🔴"},
{L:"Serie A",H:"Inter",A:"AC Milan",o:[2.20,3.00,3.20],e:"🔵"},{L:"Serie A",H:"Napoli",A:"Juventus",o:[2.40,3.10,2.90],e:"🔵"},
{L:"Bundesliga",H:"Bayern",A:"Dortmund",o:[1.70,4.00,4.50],e:"🔴"},{L:"Ligue 1",H:"PSG",A:"Marseille",o:[1.60,4.20,5.00],e:"🔵"},
{L:"NPFL",H:"Enyimba",A:"Rangers",o:[2.00,2.90,3.80],e:"🐘"},{L:"NPFL",H:"Remo Stars",A:"Kano Pillars",o:[1.85,3.10,4.30],e:"⭐"},{L:"NPFL",H:"Sporting Lagos",A:"Plateau Utd",o:[2.10,2.80,3.60],e:"🦈"},
{L:"UCL",H:"Man City",A:"Real Madrid",o:[2.30,3.40,2.90],e:"🏆"},{L:"AFCON",H:"Nigeria",A:"Ghana",o:[2.15,3.00,3.50],e:"🦅"},{L:"AFCON",H:"Senegal",A:"Egypt",o:[2.30,2.90,3.30],e:"🦁"}
];
let sel=null,active="ALL", currentUser=localStorage.getItem("fs_user"), balances=JSON.parse(localStorage.getItem("fs_bal")||"{}"), allBets=JSON.parse(localStorage.getItem("fs_bets")||"{}");
function check(){if(currentUser){document.getElementById("auth").style.display="none";document.getElementById("app").style.display="block";document.getElementById("balWrap").style.display="flex";if(!balances[currentUser])balances[currentUser]=50000;renderAll();updateBal();}}
function doLogin(){let u=document.getElementById("user").value.trim();if(!u)return document.getElementById("msg").innerText="Enter username";currentUser=u;localStorage.setItem("fs_user",u);if(!balances[u])balances[u]=50000;localStorage.setItem("fs_bal",JSON.stringify(balances));check();}
function logout(){localStorage.removeItem("fs_user");location.reload();}
function updateBal(){document.getElementById("bal").innerText="₦"+(balances[currentUser]||0).toLocaleString();drawBets();}
function renderAll(){renderFilters();renderMatches();}
function renderFilters(){document.getElementById("filters").innerHTML=leagues.map(l=>`<div class="chip ${active==l?'active':''}" onclick="setL('${l}')">${l}</div>`).join("");}
function setL(l){active=l;renderAll();}
function renderMatches(){let list=active=="ALL"?fixtures:fixtures.filter(x=>x.L==active);document.getElementById("matches").innerHTML=list.map((m,idx)=>`<div class="match"><div class="leag"><span class="liveDot"></span>${m.L} • TODAY 19:45 • ${Math.floor(Math.random()*45000)+5000} watching</div><div class="teams"><div class="tm"><div class="badgeTeam">${m.e}</div>${m.H}</div><div class="vs">VS</div><div class="tm">${m.A}<div class="badgeTeam">${m.e}</div></div></div><div class="oddsGrid"><div class="oddBtn" id="b-${idx}-H" onclick="pick(${fixtures.indexOf(m)},'HOME',${m.o[0]},${idx},'H')"><small>1 • HOME</small><b>${m.o[0]}</b></div><div class="oddBtn" id="b-${idx}-X" onclick="pick(${fixtures.indexOf(m)},'DRAW',${m.o[1]},${idx},'X')"><small>X • DRAW</small><b>${m.o[1]}</b></div><div class="oddBtn" id="b-${idx}-A" onclick="pick(${fixtures.indexOf(m)},'AWAY',${m.o[2]},${idx},'A')"><small>2 • AWAY</small><b>${m.o[2]}</b></div></div></div>`).join("");}
function pick(i,t,o,idx,k){document.querySelectorAll('.oddBtn').forEach(e=>e.classList.remove('sel'));let el=document.getElementById(`b-${idx}-${k}`);if(el)el.classList.add('sel');sel={i,t,o,m:fixtures[i]};document.getElementById("slip").style.display="block";document.getElementById("sTeams").innerText=fixtures[i].H+" vs "+fixtures[i].A+" • "+t;document.getElementById("sLeague").innerText=fixtures[i].L;document.getElementById("sOdd").innerText=o;upd();}
function setStake(v){document.getElementById("stake").value=v;upd();}
function upd(){let s=parseFloat(document.getElementById("stake").value)||0;document.getElementById("toWin").innerText="₦"+(s*(sel?sel.o:0)).toFixed(0);}
function place(){let s=parseFloat(document.getElementById("stake").value);if(!sel||s<100)return alert("Min ₦100");if(balances[currentUser]<s)return alert("Low balance");balances[currentUser]-=s;let win=Math.random()>0.45;let pot=s*sel.o;let bet={match:sel.m.H+" vs "+sel.m.A,pick:sel.t,odd:sel.o,stake:s,status:win?"WON":"LOST",potential:pot,time:Date.now()};if(!allBets[currentUser])allBets[currentUser]=[];allBets[currentUser].unshift(bet);if(win)balances[currentUser]+=pot;localStorage.setItem("fs_bal",JSON.stringify(balances));localStorage.setItem("fs_bets",JSON.stringify(allBets));updateBal();alert(bet.status+(win?" 🎉 Won ₦"+pot.toFixed(0):" 😢 Try again"));}
function drawBets(){let list=allBets[currentUser]||[];document.getElementById("bets").innerHTML=list.slice(0,10).map(b=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:6px 0;font-size:11px"><span>${b.match} <b>${b.pick}</b> @${b.odd} ₦${b.stake}</span><b style="color:${b.status=='WON'?'#22c55e':'#ef4444'}">${b.status} ${b.status=='WON'?'₦'+b.potential.toFixed(0):''}</b></div>`).join("")||"<div style='color:#5a7196;font-size:11px;text-align:center;padding:8px'>No bets yet — pick odds above</div>";}
check();
</script>
</body>
</html>

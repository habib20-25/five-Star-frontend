<!DOCTYPE html>
<html>
<head>
<title>Five Star Bets - Real Money Betting</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#080808; color:#fff; margin:0; padding:0; text-align:center}
.header{background:#121212; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #00ff88}
.logo{font-weight:bold; font-size:22px; color:#00ff88}
.balance{font-size:18px; color:#00ff88; font-weight:bold}
.hero{padding:30px 20px}
.btn{padding:14px 30px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin:10px}
.deposit{background:#00ff88; color:#000}
.withdraw{background:#ffcc00; color:#000}
.card{background:#1e1e1e; margin:15px; padding:20px; border-radius:15px; border:1px solid #333}
input{padding:12px; border-radius:8px; border:none; width:80%; margin:10px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">⭐ FIVE STAR BETS</div>
  <div class="balance">₦<span id="balance">0</span></div>
</div>

<div class="hero">
  <h1>Welcome to Five Star Bets</h1>
  <p>Deposit. Play. Win. Withdraw Instantly.</p>
  <p>Balance: <b>₦<span id="balance2">0</span></b></p>
  
  <button class="btn deposit" onclick="goDeposit()">💰 DEPOSIT NOW</button>
  <button class="btn withdraw" onclick="goWithdraw()">🏦 WITHDRAW</button>
</div>

<div class="card">
  <h3>⚽ Football - Live Games</h3>
  <p>Odds: Arsenal vs Chelsea - 2.5x</p>
  <button class="btn deposit" onclick="alert('Bet placed! Coming soon with real API')">BET NOW</button>
</div>

<div class="card">
  <h3>🎰 Casino & Virtuals</h3>
  <p>Spin & Win - Jackpot ₦1,000,000</p>
  <button class="btn deposit" onclick="alert('Casino launching soon!')">PLAY NOW</button>
</div>

<script>
// SHOW BALANCE
let bal = localStorage.getItem('five_star_balance');
if(!bal){ bal = 0; localStorage.setItem('five_star_balance', 0); }
document.getElementById('balance').innerText = bal;
document.getElementById('balance2').innerText = bal;

// DEPOSIT FUNCTION - WITH YOUR PAYSTACK LINK
function goDeposit(){
  let amount = prompt("How much do you want to deposit? Minimum ₦100", "1000");
  if(!amount){ return; }
  if(isNaN(amount) || amount < 100){
    alert("Minimum deposit is ₦100");
    return;
  }
  // Save amount for later
  localStorage.setItem('last_deposit_attempt', amount);
  
  // THIS IS YOUR REAL PAYSTACK LINK - IT COLLECTS MONEY
  window.open("https://paystack.shop/pay/mmbwjiunsi", "_blank");
  
  // After payment, user comes back
  setTimeout(function(){
    let confirmPay = confirm("Did you complete payment of ₦" + amount + " on Paystack? Click OK if YES, your balance will be updated.");
    if(confirmPay){
      let current = parseFloat(localStorage.getItem('five_star_balance') || 0);
      let newBal = current + parseFloat(amount);
      localStorage.setItem('five_star_balance', newBal);
      alert("Success! ₦" + amount + " added to your balance!");
      location.reload();
    }
  }, 3000);
}

function goWithdraw(){
  let amount = prompt("Enter amount to withdraw:", "500");
  if(!amount){ return; }
  let acc = prompt("Enter your bank account number for withdrawal:");
  if(!acc){ return; }
  alert("Withdrawal request of ₦" + amount + " to account " + acc + " received! You will be paid within 24 hours. Five Star Bets - Trusted!");
}
</script>

</body>
</html>

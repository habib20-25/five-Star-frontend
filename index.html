<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five Star Bets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#080e1f;color:#fff}
.head{background:#0e1a33;display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:3px solid #ffcc00;position:sticky;top:0;z-index:9}
.logo{font-weight:900;letter-spacing:.5px}.logo b{color:#ffcc00}
.bal{background:#ffcc00;color:#000;padding:7px 14px;border-radius:20px;font-weight:900;font-size:13px}
.auth{max-width:500px;margin:40px auto;background:#121f3f;padding:22px;border-radius:18px;border:1px solid #1e2f5e}
.inp{width:100%;padding:13px;border-radius:11px;border:1px solid #2a4173;background:#080e1f;color:#fff;margin:8px 0}
.btn{width:100%;background:#ffcc00;color:#000;padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;margin-top:8px}
.filters{display:flex;gap:6px;overflow:auto;padding:10px;scrollbar-width:none}
.f{white-space:nowrap;background:#16244a;padding:7px 13px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #253969}
.f.active{background:#ffcc00;color:#000;font-weight:800}
.wrap{max-width:500px;margin:0 auto;padding:0 10px 230px}
.card{background:#121f3f;border:1px solid #1e2f5e;border-radius:14px;padding:10px;margin:8px 0}
.league{font-size:10px;color:#7ea0d0;letter-spacing:1px}
.row{display:flex;justify-content:space-between;margin:6px 0;font-weight:700;font-size:14px}
.odds{display:flex;gap:6px;margin-top:6px}
.o{flex:1;background:#0a1430;border:1px solid #2a4173;border-radius:9px;text-align:center;padding:9px 2px;cursor:pointer;font-size:13px;line-height:1.2}
.o.sel{background:#ffcc00;color:#000;font-weight:900}
.slip{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#101d3b;border-top:2px solid #ffcc00;padding:12px;border-radius:18px 18px 0 0}
</style>
</head>
<body>
<div class="head"><div class="logo">★★★★★ FIVE <b>STAR BETS</b></div><div><span class="bal" id="bal">₦50,000</span> <button onclick="logout()" style="background:none;border:none;color:#6b86b5;font-size:10px;margin-left:6px">LOGOUT</button></div></div>

<div id="auth" class="auth">
<h2 style="text-align:center">Five Star Bets</h2>
<p style="font-size:12px;color:#7ea0d0;text-align:center;margin:8px 0 14px">All Leagues • Demo ₦50k virtual</p>
<input id="user" class="inp" placeholder="Username">
<input id="pass" class="inp" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN / REGISTER</button>
<p id="msg" style="font-size:11px;color:#ff6b6b;margin-top:8px"></p>
</div>

<div id="app" style="display:none">
<div class="filters" id="filters"></div>
<div class="wrap" id="matches"></div>
<div class="slip" id="slip" style="display:none">
<div style="display:flex;justify-content:space-between;font-size:13px"><span id="sTeams"></span><b id="sOdd"></b></div>
<input id="stake" class="inp" type="number" value="1000">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>To win:</span><b id="toWin" style="color:#ffcc00"></b></div>
<button class="btn" onclick="place()">PLACE BET - 5 STAR</button>
<div id="bets" style="margin-top:10px;font-size:11px;color:#8aa3cc;max-height:100px;overflow:auto"></div>
</div>
</div>

<script>
// CHANGE THIS LATER TO YOUR RENDER LINK
const API_URL = ""; // e.g. "https://fivestar-bets.onrender.com"

let leagues=["ALL","Premier League","LaLiga","Serie A","Bundesliga","Ligue 1","NPFL","Champions League","AFCON"];
let fixtures=[
{L:"Premier League",H:"Man City",A:"Arsenal",o:[2.1,3.2,3.3]},{L:"Premier League",H:"Man Utd",A:"Chelsea",o:[2.6,3.1,2.7]},{L:"Premier League",H:"Liverpool",A:"Tottenham",o:[1.85,3.6,4.1]},{L:"Premier League",H:"Newcastle",A:"Brighton",o:[2.2,3.3,3.1]},
{L:"LaLiga",H:"Real Madrid",A:"Barca",o:[2.0,3.5,3.6]},{L:"LaLiga",H:"Atletico",A:"Sevilla",o:[1.9,3.2,4.2]},
{L:"Serie A",H:"Inter",A:"AC Milan",o:[2.2,3.0,3.2]},{L:"Serie A",H:"Napoli",A:"Juventus",o:[2.4,3.1,2.9]},
{L:"Bundesliga",H:"Bayern",A:"Dortmund",o:[1.7,4.0,4.5]},{L:"Bundesliga",H:"Leverkusen",A:"Leipzig",o:[2.0,3.4,3.5]},
{L:"Ligue 1",H:"PSG",A:"Marseille",o:[1.6,4.2,5.0]},
{L:"NPFL",H:"Enyimba",A:"Rangers",o:[2.0,2.9,3.8]},{L:"NPFL",H:"Remo Stars",A:"Kano Pillars",o:[1.85,3.1,4.3]},{L:"NPFL",H:"Sporting Lagos",A:"Plateau Utd",o:[2.1,2.8,3.6]},
{L:"Champions League",H:"Man City",A:"Real Madrid",o:[2.3,3.4,2.9]},{L:"AFCON",H:"Nigeria",A:"Ghana",o:[2.15,3.0,3.5]},{L:"AFCON",H:"Senegal",A:"Egypt",o:[2.3,2.9,3.3]}
];
let sel=null,active="ALL";
let currentUser=localStorage.getItem("fs_user");
let balances=JSON.parse(localStorage.getItem("fs_bal")||"{}");
let allBets=JSON.parse(localStorage.getItem("fs_bets")||"{}");

function check(){
 if(currentUser){
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
  if(!balances[currentUser]) balances[currentUser]=50000;
  renderAll(); updateBal();
 }
}
function doLogin(){
 let u=document.getElementById("user").value.trim();
 if(!u) return document.getElementById("msg").innerText="Enter username";
 currentUser=u; localStorage.setItem("fs_user",u);
 if(!balances[u]) balances[u]=50000;
 localStorage.setItem("fs_bal",JSON.stringify(balances));
 check();
}
function logout(){localStorage.removeItem("fs_user"); location.reload();}
function updateBal(){document.getElementById("bal").innerText="₦"+(balances[currentUser]||0).toLocaleString(); drawBets();}
function renderAll(){renderFilters();renderMatches();}
function renderFilters(){document.getElementById("filters").innerHTML=leagues.map(l=>`<div class="f ${active==l?'active':''}" onclick="setL('${l}')">${l}</div>`).join("");}
function setL(l){active=l;renderAll();}
function renderMatches(){
 let list=active=="ALL"?fixtures:fixtures.filter(x=>x.L==active);
 document.getElementById("matches").innerHTML=list.map(m=>`<div class="card"><div class="league">${m.L} • TODAY</div><div class="row"><span>${m.H}</span><span style="color:#5a77ad">vs</span><span>${m.A}</span></div><div class="odds"><div class="o" onclick="pick(${fixtures.indexOf(m)},'H',${m.o[0]})">HOME<br>${m.o[0]}</div><div class="o" onclick="pick(${fixtures.indexOf(m)},'X',${m.o[1]})">DRAW<br>${m.o[1]}</div><div class="o" onclick="pick(${fixtures.indexOf(m)},'A',${m.o[2]})">AWAY<br>${m.o[2]}</div></div></div>`).join("")+`<div style="text-align:center;color:#3a4d74;font-size:10px;margin-top:12px">DEMO - Virtual money. For research only.</div>`;
}
function pick(i,t,o){sel={i,t,o,m:fixtures[i]};document.getElementById("slip").style.display="block";document.getElementById("sTeams").innerText=fixtures[i].H+" vs "+fixtures[i].A+" - "+t;document.getElementById("sOdd").innerText=o;upd();}
function upd(){let s=parseFloat(document.getElementById("stake").value)||0;document.getElementById("toWin").innerText="₦"+(s*(sel?sel.o:0)).toFixed(0);}
document.getElementById("stake").addEventListener("input",upd);
function place(){
 let s=parseFloat(document.getElementById("stake").value);
 if(!sel||s<100) return alert("Min ₦100");
 if(balances[currentUser]<s) return alert("Low balance");
 balances[currentUser]-=s;
 let win=Math.random()>0.45; let pot=s*sel.o;
 let bet={match:sel.m.H+" vs "+sel.m.A,pick:sel.t,odd:sel.o,stake:s,status:win?"WON":"LOST",potential:pot,time:Date.now()};
 if(!allBets[currentUser]) allBets[currentUser]=[];
 allBets[currentUser].unshift(bet);
 if(win) balances[currentUser]+=pot;
 localStorage.setItem("fs_bal",JSON.stringify(balances));
 localStorage.setItem("fs_bets",JSON.stringify(allBets));
 updateBal(); alert(bet.status+"! "+(win?"You won ₦"+pot.toFixed(0):"Try again"));
}
function drawBets(){
 let list=allBets[currentUser]||[];
 document.getElementById("bets").innerHTML=list.slice(0,20).map(b=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #1e2f5e;padding:4px 0"><span>${b.match} ${b.pick}@${b.odd} ₦${b.stake}</span><b style="color:${b.status=='WON'?'#22c55e':'#ef4444'}">${b.status}</b></div>`).join("")||"No bets yet";
}
check();
</script></body></html>
